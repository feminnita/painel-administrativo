# Render Blueprint — Front (client React/Vite) do painel administrativo como Static Site.
# Objetivo: hospedar o front na conta Render do Chris (feminnita@gmail.com),
# saindo da Vercel (conta de terceiro, travada por 2FA).
# NÃO publica sozinho: só vira deploy quando o Chris conectar este Blueprint no Render
# (Dashboard → New → Blueprint → este repo) OU criar o Static Site manualmente com estes valores.
#
# O backend (Express) já roda na Render em: painel-administrativo-rh15.onrender.com — não mexer.

services:
  - type: web
    name: painel-administrativo-client
    runtime: static
    repo: https://github.com/feminnita/painel-administrativo
    branch: main
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    # Vite injeta VITE_* em BUILD time — o front precisa saber a URL do backend aqui:
    envVars:
      - key: VITE_API_URL
        value: https://painel-administrativo-rh15.onrender.com
    # SPA: qualquer rota cai no index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
